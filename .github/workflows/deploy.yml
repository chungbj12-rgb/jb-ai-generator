# Git push 시 Next.js 빌드 검증 + Supabase DB 마이그레이션 자동 적용
name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  SUPABASE_PROJECT_ID: hcsgmnhhbsxudcdpzqhh

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run build

  supabase-migrate:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Supabase 마이그레이션 적용
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN 또는 SUPABASE_DB_PASSWORD가 없어 마이그레이션을 건너뜁니다."
            echo "GitHub → Settings → Secrets and variables → Actions 에 두 값을 추가하세요."
            exit 0
          fi

          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD" --yes
          supabase migration list --linked
          supabase db push --dry-run --linked
          supabase db push --linked
